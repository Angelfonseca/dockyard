<style>
  :root { --line: rgba(148,163,184,.14); }
  body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; font-feature-settings: 'cv11','ss01'; -webkit-font-smoothing: antialiased;
         background: radial-gradient(1100px 500px at 85% -10%, rgba(14,165,233,.09), transparent 60%), #020617; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
  .inp { background:rgba(2,6,23,.6); border:1px solid #334155; border-radius:.5rem; padding:.45rem .7rem; font-size:.875rem; outline:none; width:100%; color:#e2e8f0; transition:border-color .15s, box-shadow .15s; }
  .inp:focus { border-color:#38bdf8; box-shadow:0 0 0 3px rgba(56,189,248,.15); }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:.4rem; padding:.45rem .85rem; border-radius:.5rem; font-size:.8125rem; font-weight:500; background:#1e293b; color:#e2e8f0; white-space:nowrap; border:1px solid var(--line); transition:background .15s, border-color .15s; }
  .btn:hover { background:#273449; border-color:rgba(148,163,184,.3); }
  .btn:disabled { opacity:.4; pointer-events:none; }
  .btn-sm { padding:.3rem .6rem; font-size:.75rem; }
  .btn-primary { background:linear-gradient(180deg,#0ea5e9,#0284c7); color:white; border-color:rgba(125,211,252,.35); } .btn-primary:hover { background:linear-gradient(180deg,#38bdf8,#0369a1); }
  .btn-ok { background:#047857; color:white; } .btn-ok:hover { background:#065f46; }
  .btn-danger { background:rgba(127,29,29,.7); color:#fecaca; border-color:rgba(248,113,113,.25); } .btn-danger:hover { background:#991b1b; }
  /* botones de icono */
  .ibtn { display:inline-flex; align-items:center; justify-content:center; width:2rem; height:2rem; border-radius:.5rem; color:#94a3b8; background:transparent; border:1px solid transparent; transition:all .12s; flex-shrink:0; }
  .ibtn:hover { background:#1e293b; color:#f1f5f9; border-color:var(--line); }
  .ibtn.ok:hover { background:rgba(16,185,129,.16); color:#6ee7b7; border-color:rgba(16,185,129,.35); }

  .ibtn.pri:hover { background:rgba(14,165,233,.16); color:#7dd3fc; border-color:rgba(14,165,233,.35); }
  .ibtn.off { opacity:.3; cursor:not-allowed; } .ibtn.off:hover { background:transparent; color:#94a3b8; border-color:transparent; }
  .ibtn.solid { background:#1e293b; border-color:var(--line); }
  .card { border:1px solid var(--line); background:linear-gradient(180deg, rgba(30,41,59,.38), rgba(15,23,42,.55)); border-radius:.9rem; box-shadow:0 1px 0 rgba(255,255,255,.03) inset; }
  .card.hov { transition:border-color .15s, transform .15s, box-shadow .15s; } .card.hov:hover { border-color:rgba(56,189,248,.35); box-shadow:0 8px 30px -12px rgba(14,165,233,.25); }
  .nav a { display:flex; align-items:center; gap:.75rem; padding:.55rem .75rem; border-radius:.6rem; color:#94a3b8; font-size:.875rem; font-weight:500; white-space:nowrap; transition:all .12s; }
  .nav a:hover { background:rgba(30,41,59,.6); color:#e2e8f0; }
  .nav a.on { background:linear-gradient(90deg, rgba(14,165,233,.18), rgba(14,165,233,.05)); color:#7dd3fc; box-shadow:inset 2px 0 0 #38bdf8; }

  .tab:hover { color:#e2e8f0; } .tab.on { color:#7dd3fc; border-color:#0ea5e9; }
  .chip { display:inline-flex; align-items:center; gap:.4rem; padding:.3rem .8rem; border-radius:999px; font-size:.8125rem; background:rgba(30,41,59,.7); color:#cbd5e1; white-space:nowrap; border:1px solid var(--line); transition:all .12s; }
  .chip:hover { border-color:rgba(148,163,184,.35); } .chip.on { background:#0284c7; color:white; border-color:#38bdf8; }
  .chip small { opacity:.65; font-size:.7rem; }
  .pill { display:inline-flex; align-items:center; gap:.35rem; padding:.12rem .55rem; border-radius:999px; font-size:.7rem; font-weight:500; border:1px solid transparent; white-space:nowrap; }
  .pill::before { content:''; width:.4rem; height:.4rem; border-radius:99px; background:currentColor; }
  .pill.ok { color:#6ee7b7; background:rgba(16,185,129,.12); border-color:rgba(16,185,129,.25); }
  .pill.bad { color:#fca5a5; background:rgba(239,68,68,.12); border-color:rgba(239,68,68,.25); }
  .pill.warn { color:#fcd34d; background:rgba(245,158,11,.12); border-color:rgba(245,158,11,.25); }
  .pill.off { color:#94a3b8; background:rgba(100,116,139,.12); border-color:rgba(100,116,139,.25); }
  .tag { display:inline-flex; align-items:center; gap:.3rem; padding:.1rem .5rem; border-radius:.4rem; font-size:.7rem; background:rgba(51,65,85,.55); color:#cbd5e1; white-space:nowrap; }
  .tag.v { background:rgba(124,58,237,.18); color:#ddd6fe; } .tag.s { background:rgba(14,165,233,.16); color:#bae6fd; } .tag.g { background:rgba(16,185,129,.14); color:#a7f3d0; }
  .tile { width:2.75rem; height:2.75rem; border-radius:.8rem; display:flex; align-items:center; justify-content:center; flex-shrink:0; overflow:hidden; font-weight:700; font-size:1.1rem; color:white; letter-spacing:-.02em;
          background:linear-gradient(135deg, hsl(var(--h) 62% 42%), hsl(calc(var(--h) + 35) 62% 26%)); box-shadow:0 1px 0 rgba(255,255,255,.18) inset, 0 6px 14px -6px rgba(0,0,0,.6); }
  .tile.logo { background:linear-gradient(180deg,#1e293b,#0f172a); border:1px solid var(--line); } .tile.logo img { width:60%; height:60%; filter:invert(1) opacity(.92); }
  .tile.sm { width:2.1rem; height:2.1rem; border-radius:.6rem; font-size:.9rem; } .tile.lg { width:3.5rem; height:3.5rem; font-size:1.4rem; border-radius:1rem; }
  .tile.sq { background:#1e293b; border:1px solid var(--line); color:#94a3b8; }
  .spin { width:1rem; height:1rem; border:2px solid #475569; border-top-color:#38bdf8; border-radius:999px; animation:sp 0.8s linear infinite; display:inline-block; }
  @keyframes sp { to { transform: rotate(360deg); } }
  @keyframes pop { from { opacity:0; transform:translateY(8px) scale(.98); } to { opacity:1; transform:none; } }
  .m-panel { animation:pop .16s ease-out; }
  .seg { display:inline-flex; padding:.2rem; border-radius:.65rem; background:rgba(2,6,23,.6); border:1px solid #334155; }
  .seg button { display:inline-flex; align-items:center; gap:.4rem; padding:.35rem .8rem; border-radius:.45rem; font-size:.8125rem; color:#94a3b8; } .seg button.on { background:#0284c7; color:white; }
  #tip { position:fixed; z-index:80; pointer-events:none; background:#0b1222; color:#e2e8f0; border:1px solid rgba(148,163,184,.25); border-radius:.45rem; padding:.25rem .55rem; font-size:.72rem; font-weight:500; box-shadow:0 8px 24px rgba(0,0,0,.5); opacity:0; transition:opacity .08s; white-space:nowrap; }
  ::-webkit-scrollbar { width:10px; height:10px; } ::-webkit-scrollbar-thumb { background:#334155; border-radius:8px; }

<body class="bg-slate-950 text-slate-200 min-h-screen">

<div class="md:flex min-h-screen">
  <aside class="md:w-56 md:shrink-0 md:border-r border-slate-800 md:sticky md:top-0 md:h-screen flex md:flex-col bg-slate-950/95 backdrop-blur z-20 sticky top-0 border-b md:border-b-0">
    <div class="hidden md:flex items-center gap-3 px-5 py-5"><div class="tile sm" style="--h:200"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.5"/><path d="M12 7.5V21M5 12H3a9 9 0 0018 0h-2M8 12h8"/></svg></div><div><div class="text-base font-semibold leading-none tracking-tight">dockyard</div><div class="text-[11px] text-slate-500 mt-1">gestor de Docker</div></div></div>
    <nav id="nav" class="nav flex md:flex-col gap-1 px-2 py-2 md:px-3 overflow-x-auto"></nav>
    <div id="side-host" class="hidden md:block mt-auto px-5 py-4 text-xs text-slate-500"></div>
  </aside>

  <main class="flex-1 min-w-0">
    <div id="err" class="hidden mx-4 md:mx-8 mt-4 rounded-lg border border-red-800 bg-red-950/60 px-4 py-3 text-red-200 text-sm"></div>
    <div id="view" class="px-4 md:px-8 py-6 max-w-7xl"></div>
  </main>
</div>

<div id="modals"></div>
<div id="toasts" class="fixed bottom-4 right-4 left-4 sm:left-auto flex flex-col gap-2 items-end z-50 pointer-events-none"></div>

<script>
// ───────────── utilidades ─────────────
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const qs = o => new URLSearchParams(o).toString();
const sleep = ms => new Promise(r => setTimeout(r, ms));
const debounce = (f, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => f(...a), ms); }; };
const isSecret = k => /PASS|SECRET|TOKEN/i.test(k) || /_KEY$/i.test(k);

// Acceso: token en localStorage (no cookie: las cookies viajan a cualquier puerto del mismo host). Entra por «/#t=TOKEN».
let token = '';
try { token = localStorage.getItem('dockyard.token') || ''; } catch {}
// «/#t=TOKEN»: se guarda y se borra de la barra de direcciones; si se pega en una pestaña ya abierta, se recarga
function takeHashToken() {
  const m = location.hash.match(/^#t=([A-Za-z0-9]+)/);
  if (!m) return false;
  token = m[1]; try { localStorage.setItem('dockyard.token', token); } catch {}
  history.replaceState(null, '', location.pathname + '#/');
  return true;
}
takeHashToken();
window.addEventListener('hashchange', () => { if (takeHashToken()) location.reload(); });
function showLogin() {
  if ($('#login')) return;
  const w = document.createElement('div');
  w.id = 'login'; w.className = 'fixed inset-0 z-[60] bg-slate-950 flex items-center justify-center p-4';
  w.innerHTML = `<form class="card p-6 w-full max-w-sm space-y-4"><div class="flex items-center gap-3"><div class="tile sq">${ic('lock', 'w-5 h-5')}</div><div><div class="font-semibold">Acceso a dockyard</div><div class="text-xs text-slate-400">Pega el token que muestra <span class="mono">dockyard web</span>.</div></div></div>
    <input id="login-t" type="password" class="inp mono" placeholder="token" autocomplete="off" autofocus><button class="btn btn-primary w-full">Entrar</button></form>`;
  document.body.append(w);
  $('form', w).addEventListener('submit', e => {
    e.preventDefault();
    token = $('#login-t').value.trim();
    try { localStorage.setItem('dockyard.token', token); } catch {}
    location.reload();
  });
}
async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { ...(opts.headers || {}), 'X-Dockyard-Token': token } });
  if (r.status === 401) { try { localStorage.removeItem('dockyard.token'); } catch {} token = ''; showLogin(); throw new Error('sin acceso'); }
  const data = (r.headers.get('content-type') || '').includes('json') ? await r.json() : await r.text();
  if (!r.ok) throw new Error((data && data.error) || data || r.statusText);
  return data;
}
const post = (path, body) => api(path, { method: 'POST', body: body === undefined ? undefined : typeof body === 'string' ? body : JSON.stringify(body) });

function toast(msg, ok = true) {
  const t = document.createElement('div');
  t.className = `pointer-events-auto max-w-md rounded-lg px-4 py-2.5 text-sm shadow-xl whitespace-pre-line ${ok ? 'bg-emerald-700 text-white' : 'bg-red-700 text-white'}`;
  t.textContent = msg;
  $('#toasts').append(t);
  setTimeout(() => t.remove(), ok ? 3000 : 9000);
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast('Copiado'); }
  catch { // http sin TLS: clipboard API puede no estar disponible
    const ta = document.createElement('textarea'); ta.value = text; document.body.append(ta); ta.select();
    document.execCommand('copy'); ta.remove(); toast('Copiado');
  }
}
function bar(pct, warn = 75, bad = 90) {
  const p = Math.max(0, Math.min(100, pct || 0));
  const c = p >= bad ? 'bg-red-500' : p >= warn ? 'bg-amber-500' : 'bg-sky-500';
  return `<div class="h-1.5 rounded bg-slate-800 mt-2"><div class="h-1.5 rounded ${c} transition-all" style="width:${p}%"></div></div>`;
}
function stat(title, value, sub = '', extra = '', icon = '') {
  return `<div class="card px-4 py-3"><div class="flex items-center justify-between text-xs uppercase tracking-wide text-slate-500"><span>${title}</span>${icon ? `<span class="text-slate-600">${ic(icon)}</span>` : ''}</div>
    <div class="text-2xl font-semibold mt-1 tracking-tight">${value}</div><div class="text-xs text-slate-400 truncate">${sub}</div>${extra}</div>`;
}
const empty = (msg, sub = '') => `<div class="card px-6 py-10 text-center text-slate-400"><div>${msg}</div><div class="text-sm text-slate-500 mt-1">${sub}</div></div>`;
const loading = (msg = 'cargando…') => `<div class="flex items-center gap-3 text-slate-400 py-6"><span class="spin"></span>${msg}</div>`;

// ───────────── iconos (trazo, estilo Lucide) y botones ─────────────
const ICONS = {
  logs: '<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
  terminal: '<path d="M4 17l6-6-6-6M12 19h8"/>',
  play: '<path d="M7 4.5l13 7.5-13 7.5z"/>',
  stop: '<rect x="6" y="6" width="12" height="12" rx="2"/>',
  restart: '<path d="M21 12a9 9 0 11-3-6.7L21 8M21 3v5h-5"/>',
  trash: '<path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6M10 11v6M14 11v6"/>',
  external: '<path d="M15 3h6v6M10 14L21 3M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/>',
  sliders: '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
  update: '<circle cx="12" cy="12" r="9"/><path d="M12 16V8M8 12l4-4 4 4"/>',
  archive: '<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10a1 1 0 001 1h12a1 1 0 001-1V9M10 13h4"/>',
  download: '<path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v3h16v-3"/>',
  history: '<path d="M3 12a9 9 0 109-9 9.7 9.7 0 00-6.7 3L3 8M3 3v5h5M12 7v5l3 2"/>',
  git: '<path d="M6 3v12"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 01-9 9"/>',
  lock: '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/>',
  key: '<circle cx="8" cy="15" r="4"/><path d="M10.8 12.2L20 3M16 7l3 3"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  copy: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h8"/>',
  eye: '<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  package: '<path d="M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"/>',
  database: '<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
  cpu: '<rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/>',
  layers: '<path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5"/>',
  wrench: '<path d="M14.7 6.3a4 4 0 00-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 005.4-5.4l-2.4 2.4-2.6-.6-.6-2.6z"/>',
  gamepad: '<rect x="2" y="7" width="20" height="11" rx="4"/><path d="M7 10v5M4.5 12.5h5M15 12h.01M18 14h.01"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 01-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 01-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 01-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 010-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 012.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 014 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 012.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 010 4h-.1a1.7 1.7 0 00-1.5 1z"/>',
  sparkles: '<path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/>',
  check: '<path d="M5 12l5 5 9-10"/>',
  alert: '<path d="M12 3l10 18H2zM12 10v5M12 18h.01"/>',
  thermo: '<path d="M14 14.8V5a2 2 0 00-4 0v9.8a4 4 0 104 0z"/>',
  activity: '<path d="M3 12h4l3 8 4-16 3 8h4"/>',
  chip: '<rect x="4" y="7" width="16" height="10" rx="1.5"/><path d="M8 7V4M12 7V4M16 7V4M8 20v-3M12 20v-3M16 20v-3"/>',
  plug: '<path d="M9 2v6M15 2v6M6 8h12v4a6 6 0 01-12 0zM12 18v4"/>',
  folder: '<path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>',
  heart: '<path d="M20.8 5.6a5.5 5.5 0 00-7.8 0L12 6.7l-1-1.1a5.5 5.5 0 00-7.8 7.8l1 1.1L12 22l7.8-7.5 1-1.1a5.5 5.5 0 000-7.8z"/>',
  anchor: '<circle cx="12" cy="5" r="2.5"/><path d="M12 7.5V21M5 12H3a9 9 0 0018 0h-2M8 12h8"/>',
};
const ic = (n, c = 'w-4 h-4') => `<svg class="${c} shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ''}</svg>`;
// botón de icono con tooltip. `attrs` son atributos HTML ya escapados (data-do=…); `kind`: ok | dng | pri | off | solid
const ibtn = (icon, tip, attrs = '', kind = '') => `<button type="button" class="ibtn ${kind}" data-tip="${esc(tip)}" aria-label="${esc(tip)}" ${attrs}>${ic(icon)}</button>`;
const ilink = (icon, tip, href, attrs = '', kind = '') => `<a class="ibtn ${kind}" data-tip="${esc(tip)}" aria-label="${esc(tip)}" href="${esc(href)}" ${attrs}>${ic(icon)}</a>`;
const spinner = txt => `<span class="flex items-center gap-2 text-xs text-slate-400 px-2"><span class="spin"></span>${esc(txt)}</span>`;

// tooltip único, posicionado con fixed para que ningún contenedor con overflow lo recorte
{
  const tip = document.createElement('div'); tip.id = 'tip'; document.body.append(tip);
  document.addEventListener('mouseover', e => {
    const el = e.target.closest?.('[data-tip]');
    if (!el) { tip.style.opacity = 0; return; }
    tip.textContent = el.dataset.tip; tip.style.opacity = 1;
    const r = el.getBoundingClientRect(), t = tip.getBoundingClientRect();
    tip.style.left = Math.max(6, Math.min(innerWidth - t.width - 6, r.left + r.width / 2 - t.width / 2)) + 'px';
    tip.style.top = (r.top - t.height - 8 < 4 ? r.bottom + 8 : r.top - t.height - 8) + 'px';
  });
  document.addEventListener('scroll', () => tip.style.opacity = 0, true);
  document.addEventListener('click', () => tip.style.opacity = 0, true);

// Trabajo largo con progreso en vivo. `render(result)` arma la vista final.
async function runJob(start, title, render) {
  const m = modal(`${mHead(esc(title))}
    <div class="flex-1 overflow-auto px-5 py-4 space-y-3">
      <div id="jstate" class="flex items-center gap-3 text-sky-300"><span class="spin"></span><span>En curso…</span></div>
      <pre id="jlines" class="mono text-xs bg-slate-900 rounded-lg p-3 max-h-72 overflow-auto whitespace-pre-wrap text-slate-300 empty:hidden"></pre>
      <div id="jresult"></div>
    </div>
    <div class="flex justify-end px-5 py-3 border-t border-slate-800"><button class="btn" data-do="closeModal">Cerrar</button></div>`, { wide: true });
  let id;
  try { id = (await start).job; }
  catch (e) { $('#jstate', m).innerHTML = `<span class="text-red-300">✘ ${esc(e.message)}</span>`; return; }
  while (document.body.contains(m)) {
    let j;
    try { j = await api('/api/job?id=' + id); } catch (e) { await sleep(1500); continue; }
    const pre = $('#jlines', m);
    pre.textContent = j.lines.join('\n');
    pre.scrollTop = pre.scrollHeight;
    if (j.done) {
      $('#jstate', m).innerHTML = j.ok ? `<span class="text-emerald-300 font-medium">✔ Listo</span>`
        : `<div class="w-full rounded-lg border border-red-800 bg-red-950/50 px-4 py-3 text-red-200 text-sm whitespace-pre-wrap">✘ ${esc(j.result.error)}</div>`;
      if (j.ok && render) $('#jresult', m).innerHTML = render(j.result);
      refreshState(); view.reload && view.reload();
      return;
    }
    await sleep(700);
  }
}

// «ip:host→cont/udp» de la lista de contenedores → enlace si se puede abrir desde aquí
function portLinks(ports) {
  if (!ports) return '<span class="text-slate-600">—</span>';
  return ports.split(', ').map(p => {
    const m = p.match(/^(?:(.+):)?(\d+)→(\d+)(\/\w+)?$/);
    if (!m || m[4] === '/udp' || m[1] === '127.0.0.1' || m[1] === '::1') return `<span class="mono">${esc(p)}</span>`;
    const host = m[1] || location.hostname;
    return `<a href="http://${esc(host)}:${m[2]}" target="_blank" rel="noopener" class="mono text-sky-400 hover:underline">${esc(p)}</a>`;
  }).join('<span class="text-slate-600">, </span>');
}
function parsePort(s) {
  let [body, proto = 'tcp'] = s.split('/');
  const parts = body.split(':');
  if (parts.length >= 3) return { ip: parts.slice(0, -2).join(':'), host: parts.at(-2), cont: parts.at(-1), proto };
  if (parts.length === 2) return { ip: '', host: parts[0], cont: parts[1], proto };
  return { ip: '', host: '', cont: parts[0], proto };
}
const joinPort = p => (p.host ? (p.ip ? `${p.ip}:` : '') + `${p.host}:` : '') + p.cont + (p.proto && p.proto !== 'tcp' ? `/${p.proto}` : '');
function splitWords(s) { return [...s.matchAll(/"([^"]*)"|'([^']*)'|(\S+)/g)].map(m => m[1] ?? m[2] ?? m[3]); }
const joinWords = a => a.map(w => /\s/.test(w) ? `"${w}"` : w).join(' ');

// Enlaza un formulario con su plan: cada cambio se escribe en `plan` y llama a onChange.
function bindPlanForm(root, getPlan, rerender, onChange) {
  root.addEventListener('input', e => {
    const el = e.target, plan = getPlan(), i = +el.dataset.svc;
    if (Number.isNaN(i) || !plan.services[i]) return;
    const s = plan.services[i], k = +el.dataset.idx;
    if (el.dataset.f) s[el.dataset.f] = el.dataset.f === 'cmd' ? splitWords(el.value) : el.value.trim();
    if (el.dataset.port) {
      const box = el.closest('.flex'); const get = n => $(`[data-port=${n}]`, box)?.value.trim() ?? '';
      const ip = root.dataset.mode === 'edit' ? get('ip') : (root.dataset.ip || '');
      s.ports[k] = joinPort({ ip, host: get('host'), cont: get('cont'), proto: get('proto') });
    }
    if (el.dataset.env) { const box = el.closest('.flex'); s.env[k] = `${$('[data-env=k]', box).value.trim()}=${$('[data-env=v]', box).value}`; }
    if (el.dataset.vol) { const box = el.closest('.flex'); s.volumes[k] = `${$('[data-vol=src]', box).value.trim()}:${$('[data-vol=dst]', box).value.trim()}`; }
    onChange();
  });
  root.addEventListener('click', e => {
    const b = e.target.closest('[data-do]'); if (!b) return;
    const plan = getPlan(), i = +b.dataset.svc;
    if (b.dataset.do === 'addRow') {
      const s = plan.services[i];
      if (b.dataset.list === 'ports') s.ports.push(joinPort({ ip: root.dataset.ip || '', host: '', cont: '', proto: 'tcp' }));
      if (b.dataset.list === 'env') s.env.push('=');
      if (b.dataset.list === 'volumes') s.volumes.push(':');
      rerender(); onChange();
    } else if (b.dataset.do === 'delRow') {
      plan.services[i][b.dataset.list].splice(+b.dataset.idx, 1); rerender(); onChange();
    } else if (b.dataset.do === 'reveal') {
      const inp = b.closest('.relative').querySelector('input'); inp.type = inp.type === 'password' ? 'text' : 'password';
    } else if (b.dataset.do === 'copyPrev') {
      copy(b.closest('.relative').querySelector('input').value);
    }
  });
}
// Limpia filas vacías antes de enviar
function tidy(plan) {
  for (const s of plan.services) {
    s.ports = s.ports.filter(p => parsePort(p).cont);
    s.env = s.env.filter(e => e.split('=')[0].trim());
    s.volumes = s.volumes.filter(v => v.replace(':', '').trim());
  }
  return plan;
}

async function act(id, a) {

}
async function downStack(stack) {

  catch (e) { toast(e.message, false); }
  refreshState();
}

// ───────────── pestaña «Entorno»: variables de entorno de un contenedor ─────────────
const ENV_KEY = /^[A-Za-z_][A-Za-z0-9_.-]*$/;
function parseDotenv(text) {
  const out = [];
  for (let line of text.split(/\r?\n/)) {
    line = line.trim().replace(/^export\s+/, '');
    if (!line || line.startsWith('#')) continue;
    const i = line.indexOf('=');
    if (i < 1) continue;
    let v = line.slice(i + 1).trim();
    if (v.length >= 2 && ((v[0] === '"' && v.at(-1) === '"') || (v[0] === "'" && v.at(-1) === "'"))) v = v.slice(1, -1);
    out.push([line.slice(0, i).trim(), v]);
  }
  return out;
}
const toDotenv = rows => rows.map(([k, v]) => `${k}=${/[\s#"'$]/.test(v) ? JSON.stringify(v) : v}`).join('\n');

function envTab(m, body, id, c, detail) {

  const bad = r => !r.del && (!ENV_KEY.test(r.k.trim()) || keys(rows).filter(k => k === r.k.trim()).length > 1);
  const BADGE = { new: ['s', 'nueva'], mod: ['v', 'modificada'], del: ['', 'se quita'] };

  const rowHtml = (r, i) => {
    const s = st(r), secret = isSecret(r.k), masked = secret && !reveal;
    return `<div class="flex items-center gap-2 px-3 py-1.5 border-t border-slate-800/70 first:border-t-0 ${r.del ? 'opacity-50' : ''}" data-row="${i}">
      <input class="inp mono !w-40 sm:!w-56 shrink-0 ${bad(r) ? '!border-red-500' : ''} ${r.del ? 'line-through' : ''}" data-k value="${esc(r.k)}" placeholder="NOMBRE" ${r.del ? 'disabled' : ''} spellcheck="false" autocomplete="off">
      <span class="text-slate-600">=</span>
      <input class="inp mono flex-1 min-w-0 ${r.del ? 'line-through' : ''}" data-v type="${masked ? 'password' : 'text'}" value="${esc(r.v)}" placeholder="valor" ${r.del ? 'disabled' : ''} spellcheck="false" autocomplete="new-password">
      <span class="w-20 hidden sm:block" data-badge>${s ? `<span class="tag ${BADGE[s][0]}">${BADGE[s][1]}</span>` : ''}</span>
      ${r.del ? ibtn('history', 'Deshacer', `data-act="undo" data-i="${i}"`) : ibtn('trash', r.o ? 'Quitar variable' : 'Descartar', `data-act="del" data-i="${i}"`, 'dng')}</div>`;
  };
  const summary = () => {
    const n = { new: 0, mod: 0, del: 0 };
    for (const r of rows) { const s = st(r); if (s) n[s]++; }
    return n;
  };
  const paintList = () => {
    const f = filter.toLowerCase();
    const html = rows.map((r, i) => (!f || r.k.toLowerCase().includes(f)) ? rowHtml(r, i) : '').join('');
    $('#env-list', body).innerHTML = html || `<div class="px-4 py-8 text-center text-sm text-slate-500">${rows.length ? 'Nada coincide.' : 'Este contenedor no tiene variables propias. Agrega una arriba.'}</div>`;
    paintFoot();
  };
  const paintFoot = () => {
    const n = summary(), total = n.new + n.mod + n.del, invalid = rows.some(bad);
    $('#env-sum', body).innerHTML = total ? [n.new && `<span class="tag s">+${n.new} nuevas</span>`, n.mod && `<span class="tag v">${n.mod} modificadas</span>`, n.del && `<span class="tag">−${n.del} quitadas</span>`].filter(Boolean).join(' ') : '<span class="text-slate-500">Sin cambios</span>';
    $('[data-go]', body).disabled = !total || invalid;
    $('#env-err', body).textContent = invalid ? 'Hay nombres inválidos o repetidos (letras, números, _ . -; no empieza con número).' : '';
  };

  body.innerHTML = `<div class="space-y-4">
    <div class="rounded-lg bg-slate-900 px-4 py-3 text-sm text-slate-300 flex gap-2">${ic('info', 'w-4 h-4 mt-0.5')}<span>Variables propias de <b>${esc(c.name)}</b> (no se muestran las que ya trae la imagen). Al aplicar, el contenedor se <b>recrea</b> con los cambios; sus volúmenes y datos se conservan.</span></div>
    <div class="flex flex-wrap items-center gap-2">
      <div class="relative"><span class="absolute left-2.5 top-2.5 text-slate-500">${ic('search')}</span><input id="env-q" class="inp !pl-8 !w-48" placeholder="Filtrar…"></div>
      <button class="btn btn-sm" data-t="add">${ic('plus')}Variable</button>
      <button class="btn btn-sm" data-t="paste">${ic('copy')}Pegar .env</button>
      <span class="ml-auto flex gap-0.5">${ibtn('eye', 'Mostrar u ocultar valores secretos', 'data-t="reveal"')}${ibtn('copy', 'Copiar como .env', 'data-t="copy"')}</span></div>
    <div id="env-list" class="card overflow-hidden"></div>
    <div id="env-err" class="text-sm text-red-300"></div>
    <div class="flex flex-wrap items-center gap-2"><div id="env-sum" class="flex flex-wrap gap-1.5 text-sm"></div>
      <div class="ml-auto flex gap-2"><button class="btn" data-t="reset">Descartar</button><button class="btn btn-primary" data-go>${ic('check')}Aplicar y recrear</button></div></div></div>`;
  paintList();

  $('#env-q', body).addEventListener('input', e => { filter = e.target.value; paintList(); });
  // edición en sitio: no se repinta la lista para no perder el foco
  $('#env-list', body).addEventListener('input', e => {
    const row = e.target.closest('[data-row]'); if (!row) return;
    const r = rows[+row.dataset.row];
    if (e.target.matches('[data-k]')) { r.k = e.target.value; e.target.classList.toggle('!border-red-500', bad(r)); }
    if (e.target.matches('[data-v]')) r.v = e.target.value;
    const s = st(r); $('[data-badge]', row).innerHTML = s ? `<span class="tag ${BADGE[s][0]}">${BADGE[s][1]}</span>` : '';
    paintFoot();
  });
  $('#env-list', body).addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const i = +b.dataset.i;
    if (b.dataset.act === 'del') { if (rows[i].o) rows[i].del = true; else rows.splice(i, 1); }
    if (b.dataset.act === 'undo') rows[i].del = false;
    paintList();
  });
  const root = body.firstElementChild; // se descarta con el contenido: no acumula escuchas entre visitas a la pestaña
  root.addEventListener('click', async e => {
    const b = e.target.closest('[data-t]'); if (!b) return;
    const a = b.dataset.t;
    if (a === 'add') { filter = ''; $('#env-q', body).value = ''; rows.push({ k: '', v: '', o: null, del: false }); paintList(); const ks = $$('[data-k]', body); ks.at(-1)?.focus(); }
    if (a === 'reveal') { reveal = !reveal; paintList(); }
    if (a === 'reset') { rows = svc.env.map(x => { const i = x.indexOf('='); return { k: x.slice(0, i), v: x.slice(i + 1), o: [x.slice(0, i), x.slice(i + 1)], del: false }; }); paintList(); }
    if (a === 'copy') copy(toDotenv(rows.filter(r => !r.del).map(r => [r.k, r.v])));
    if (a === 'paste') {
      const pm = modal(`${mHead('Pegar variables', 'Formato .env: <span class="mono">NOMBRE=valor</span>, una por línea. Las que ya existan se actualizan.')}
        <div class="px-5 py-4"><textarea id="env-paste" class="inp mono h-56" spellcheck="false" placeholder="# comentario&#10;API_URL=https://ejemplo.com&#10;DEBUG=true"></textarea></div>
        <div class="flex justify-end gap-2 px-5 py-3 border-t border-slate-800"><button class="btn" data-do="closeModal">Cancelar</button><button class="btn btn-primary" data-ok>Agregar</button></div>`);
      $('#env-paste', pm).focus();
      $('[data-ok]', pm).addEventListener('click', () => {
        for (const [k, v] of parseDotenv($('#env-paste', pm).value)) {
          const r = rows.find(x => !x.del && x.k === k);
          if (r) r.v = v; else rows.push({ k, v, o: null, del: false });
        }
        pm.close(); paintList();
      });
    }
  });
  $('[data-go]', body).addEventListener('click', async () => {
    const n = summary();
    const plan = structuredClone(detail.plan);
    plan.services[0].env = rows.filter(r => !r.del).map(r => `${r.k.trim()}=${r.v}`);
    const chk = await post('/api/check', tidy(structuredClone(plan))).catch(err => ({ errors: [err.message] }));
    if (chk.errors.length) { $('#env-err', body).textContent = chk.errors.join('\n'); return; }
    if (!await ask(`Aplicar variables a ${c.name}`, `${[n.new && `${n.new} nueva(s)`, n.mod && `${n.mod} modificada(s)`, n.del && `${n.del} quitada(s)`].filter(Boolean).join(', ')}.\nEl contenedor se detiene unos segundos mientras se recrea.`, { okText: 'Aplicar' })) return;
    m.close();
    runJob(post('/api/edit?id=' + encodeURIComponent(id), tidy(plan)), `Aplicando variables a ${c.name}`);
  });
}

// ───────────── pestaña «Túnel»: abrir un puerto del contenedor a internet (sandbox) ─────────────
const fmtLeft = s => s <= 0 ? 'venciendo…' : s >= 3600 ? `${Math.floor(s / 3600)} h ${Math.floor(s % 3600 / 60)} min` : `${Math.max(1, Math.floor(s / 60))} min`;
let reloadTunnels = null;
function tunnelResult(t) {
  return `<div class="space-y-3"><div class="text-sm text-emerald-300">✔ Túnel abierto: ya es público.</div>
    <div class="card px-4 py-3 flex items-center gap-2"><a href="${esc(t.url)}" target="_blank" rel="noopener" class="mono text-sky-400 hover:underline break-all text-sm flex-1">${esc(t.url)}</a>${ibtn('copy', 'Copiar enlace', `data-do="copy" data-text="${esc(t.url)}"`)}</div>
    ${t.auth ? `<div class="text-sm"><div class="text-slate-400 mb-1">Acceso (guárdalo; también está en la pestaña Túnel)</div><div class="card px-4 py-2 flex items-center gap-2"><span class="mono text-sm flex-1 break-all">${esc(t.auth)}</span>${ibtn('copy', 'Copiar', `data-do="copy" data-text="${esc(t.auth)}"`)}</div></div>`
      : '<div class="text-sm text-amber-300">Este túnel no pide contraseña: cualquiera con el enlace entra.</div>'}</div>`;
}

async function tunnelTab(m, body, id, c, setTimer) {
  let d;
  try { d = await api('/api/tunnel/info?id=' + encodeURIComponent(id)); } catch (e) { body.innerHTML = `<div class="text-red-300">${esc(e.message)}</div>`; return; }
  const cur = () => findC(id) || c;
  let prov = 'cloudflare';
  const listHtml = () => !d.tunnels.length ? '' : `<div class="space-y-3">${d.tunnels.map(t => `<div class="card p-4 space-y-2.5">
      <div class="flex flex-wrap items-center gap-2"><span class="pill ${t.running && t.url ? 'ok' : 'warn'}">${t.running ? (t.url ? 'Público' : 'Abriendo') : 'Detenido'}</span>
        <span class="tag">${esc(t.provider)}</span><span class="tag mono">:${t.port}</span>
        <span class="text-xs text-slate-400 ml-auto">${t.expires ? 'se cierra en ' + fmtLeft(t.expires - d.now) : 'sin límite de tiempo'}</span>
        ${ibtn('stop', 'Cerrar el túnel', `data-do="tunnelStop" data-name="${esc(t.name)}"`, 'dng')}</div>
      ${t.url ? `<div class="flex items-center gap-1"><a href="${esc(t.url)}" target="_blank" rel="noopener" class="mono text-sky-400 hover:underline break-all text-sm flex-1">${esc(t.url)}</a>${ibtn('copy', 'Copiar enlace', `data-do="copy" data-text="${esc(t.url)}"`)}${ilink('external', 'Abrir', t.url, 'target="_blank" rel="noopener"', 'pri')}</div>` : ''}
      ${t.auth ? `<div class="flex items-center gap-2 text-xs text-slate-400">${ic('lock', 'w-3.5 h-3.5')}Acceso: <span class="mono blur-sm hover:blur-none transition cursor-pointer select-all">${esc(t.auth)}</span>${ibtn('copy', 'Copiar acceso', `data-do="copy" data-text="${esc(t.auth)}"`)}</div>` : `<div class="text-xs text-amber-300/90">Sin contraseña: cualquiera con el enlace entra.</div>`}</div>`).join('')}</div>`;
  const form = !cur().up ? `<div class="card px-4 py-5 text-sm text-slate-400">Inicia el contenedor para poder abrir un túnel.</div>`
    : !d.ports.length ? `<div class="card px-4 py-5 text-sm text-slate-400">Este contenedor no declara puertos TCP (EXPOSE o publicados), así que no hay nada que abrir.</div>`
    : `<form id="tn-form" class="card p-4 space-y-4"><div class="font-medium">Abrir un túnel nuevo</div>
      <div class="grid sm:grid-cols-2 gap-3">
        <label class="block"><span class="text-xs text-slate-400">Puerto del contenedor (HTTP)</span><select name="port" class="inp mono mt-1">${d.ports.map(p => `<option>${p}</option>`).join('')}</select></label>
        <label class="block"><span class="text-xs text-slate-400">Se cierra solo en</span><select name="hours" class="inp mt-1">${[[1, '1 hora'], [2, '2 horas'], [4, '4 horas'], [12, '12 horas'], [24, '24 horas'], [0, 'Nunca (hasta cerrarlo)']].map(([v, l]) => `<option value="${v}" ${v === 2 ? 'selected' : ''}>${l}</option>`).join('')}</select></label></div>
      <div class="seg" id="tn-seg"><button type="button" data-p="cloudflare" class="on">${ic('globe', 'w-3.5 h-3.5')}Cloudflare · sin cuenta</button><button type="button" data-p="ngrok">${ic('key', 'w-3.5 h-3.5')}ngrok · con authtoken</button></div>
      <div id="tn-cf" class="text-xs text-slate-400 leading-relaxed">Genera un enlace <span class="mono">*.trycloudflare.com</span> al instante, sin registrarte. <b class="text-amber-300">No pide contraseña</b>: usa datos de prueba. Solo HTTP(S).</div>
      <div id="tn-ng" class="hidden space-y-3">
        ${d.ngrok_env ? '<div class="text-xs text-emerald-300">Se usará el authtoken de <span class="mono">DOCKYARD_NGROK_AUTHTOKEN</span> del servidor.</div>'
          : `<label class="block"><span class="text-xs text-slate-400">Authtoken de ngrok (dashboard.ngrok.com → Your Authtoken)</span><input name="authtoken" type="password" class="inp mono mt-1" autocomplete="new-password" placeholder="2abc…"></label>
             <p class="text-xs text-slate-500">Solo se usa para crear este túnel y queda en la configuración del contenedor del túnel. Para no teclearlo, define <span class="mono">DOCKYARD_NGROK_AUTHTOKEN</span> al iniciar el panel.</p>`}
        <label class="flex items-start gap-2 text-sm text-slate-300"><input type="checkbox" name="auth" checked class="mt-0.5 accent-sky-500"><span>Pedir usuario y contraseña (se generan y te los muestro)</span></label></div>
      <div class="flex gap-2 text-xs text-amber-300/90 leading-relaxed">${ic('alert', 'w-4 h-4 mt-0.5')}<span>Esto publica <b>${esc(c.name)}</b> en internet. Úsalo para pruebas (webhooks, demos, otro dispositivo), no con datos reales. El túnel se cierra solo al vencer o si el contenedor se recrea.</span></div>
      <div class="flex justify-end"><button class="btn btn-primary">${ic('globe')}Abrir túnel público</button></div></form>`;
  body.innerHTML = `<div class="space-y-4"><p class="text-sm text-slate-400">Comparte un puerto de <b class="text-slate-200">${esc(c.name)}</b> con una URL pública para probarlo en un sandbox, sin abrir puertos en tu router.</p>
    <div id="tn-list"></div>${form}</div>`;
  const paint = () => $('#tn-list', body).innerHTML = listHtml();
  paint();
  const reload = async () => {
    try { d = { ...d, ...(await api('/api/tunnel/info?id=' + encodeURIComponent(id))) }; paint(); } catch {}
  };
  reloadTunnels = reload;
  setTimer(setInterval(() => document.body.contains(m) && reload(), 5000));

  const f = $('#tn-form', body); if (!f) return;
  $('#tn-seg', body).addEventListener('click', e => {
    const b = e.target.closest('[data-p]'); if (!b) return;
    prov = b.dataset.p;
    $$('#tn-seg button', body).forEach(x => x.classList.toggle('on', x === b));
    $('#tn-cf', body).classList.toggle('hidden', prov !== 'cloudflare');
    $('#tn-ng', body).classList.toggle('hidden', prov !== 'ngrok');
  });
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const port = f.port.value, hours = f.hours.value;
    const lim = hours === '0' ? 'sin límite de tiempo' : `durante ${hours} h`;
    if (!await ask('Abrir un túnel público', `Se publicará <b>${esc(c.name)}:${esc(port)}</b> en internet (${lim}) con ${prov === 'ngrok' ? 'ngrok' : 'Cloudflare'}.\n${prov === 'cloudflare' ? 'Cualquiera con el enlace podrá entrar, sin contraseña.' : f.auth.checked ? 'Pedirá usuario y contraseña.' : 'Cualquiera con el enlace podrá entrar, sin contraseña.'}`, { okText: 'Abrir túnel', danger: true })) return;
    const q = { id, port, hours, provider: prov }; if (prov === 'ngrok' && f.auth.checked) q.auth = 1;
    const authtoken = prov === 'ngrok' && f.authtoken ? f.authtoken.value.trim() : '';
    runJob(post('/api/tunnel?' + qs(q), authtoken ? { authtoken } : undefined), `Túnel · ${c.name}:${port}`, r => tunnelResult(r.tunnel));
  });
}

// ───────────── vista: tienda ─────────────

  cat: '', only: '',
  async mount() {
    $('#view').innerHTML = `<div class="flex flex-wrap items-end gap-3 mb-5"><div><h1 class="text-2xl font-semibold tracking-tight">Tienda</h1>
        <p class="text-sm text-slate-400">Bases de datos, apps y servicios listos para instalar. Las contraseñas se generan solas.</p></div>
        <div class="flex gap-2 w-full sm:w-auto sm:ml-auto"><div class="relative flex-1"><span class="absolute left-2.5 top-2.5 text-slate-500">${ic('search')}</span>
          <input id="s-q" class="inp !pl-8 sm:!w-72" placeholder="Buscar (ej. postgres, fotos, vpn)…"></div>
          <button class="btn" data-do="gitModal">${ic('git')}Desde Git</button></div></div>
      <div id="s-cats" class="flex gap-2 overflow-x-auto pb-2 mb-4"></div><div id="s-grid" class="grid sm:grid-cols-2 xl:grid-cols-3 gap-4">${loading()}</div>`;
    catalog ??= await api('/api/catalog');
    $('#s-q').addEventListener('input', () => this.paint());

    this.sig = (state?.containers || []).map(c => c.image).join();

    $('#s-q').focus();
  },
  update() {

  },
  // contenedores ya instalados con la imagen principal de la plantilla
  installed(t) {
    const base = t.image && t.image.split(':')[0];
    return base ? (state?.containers || []).filter(c => c.image.split(':')[0] === base) : [];
  },
  paint() {
    const catOf = t => t.category || 'Otros', cats = [...new Set(catalog.map(catOf))];
    const count = c => catalog.filter(t => !c || catOf(t) === c).length;
    $('#s-cats').innerHTML = [['', 'Todo'], ...cats.map(c => [c, c])].map(([c, l]) =>
      `<button class="chip ${c === this.cat ? 'on' : ''}" data-cat="${esc(c)}">${c ? ic(CAT_ICON[c] || 'package', 'w-3.5 h-3.5') : ''}${esc(l)}<small>${count(c)}</small></button>`).join('');
    const q = $('#s-q').value.toLowerCase();
    const list = catalog.filter(t => (!this.cat || catOf(t) === this.cat) && (!q || [t.name, t.id, t.description, t.category, ...t.images].some(x => (x || '').toLowerCase().includes(q))));
    $('#s-grid').innerHTML = list.map(t => {
      const have = this.installed(t), p = t.svcs.find(s => s.primary) || t.svcs[0] || {};

      const envN = t.svcs.reduce((a, s) => a + s.env.length, 0), volN = t.svcs.reduce((a, s) => a + s.volumes.length, 0);
      return `<div class="card hov p-4 flex flex-col gap-3">
        <div class="flex items-start gap-3">${tile(t)}
          <div class="min-w-0 flex-1"><div class="font-semibold leading-tight truncate">${esc(t.name)}</div><div class="text-xs text-slate-500 mt-0.5">${esc(t.category)}</div></div>
          ${have.length ? `<span class="pill ok shrink-0" data-tip="${esc(have.map(c => c.name).join(', '))}">${have.length > 1 ? have.length + ' instalados' : 'Instalado'}</span>` : ''}</div>
        <p class="text-sm text-slate-300 flex-1 leading-relaxed">${esc(t.description)}</p>
        <div class="flex flex-wrap gap-1.5">
          ${t.services > 1 ? `<span class="tag v">${ic('layers', 'w-3 h-3')}${t.services} servicios</span>` : ''}

          ${volN ? `<span class="tag">${ic('database', 'w-3 h-3')}${volN} ${volN > 1 ? 'volúmenes' : 'volumen'}</span>` : ''}

// Ficha de una plantilla: qué se instala, puertos, volúmenes, variables y límites.
function storeDetail(tid) {
  const t = catalog.find(x => x.id === tid); if (!t) return;
  const have = Store.installed(t);
  const sum = [['Servicios', t.svcs.length, 'layers'], ['Puertos', t.svcs.reduce((a, s) => a + s.ports.length, 0), 'plug'], ['Volúmenes', t.svcs.reduce((a, s) => a + s.volumes.length, 0), 'database'], ['Variables', t.svcs.reduce((a, s) => a + s.env.length, 0), 'sliders']];
  const sec = (title, icon, body) => body ? `<div><div class="flex items-center gap-1.5 text-xs uppercase tracking-wide text-slate-500 mb-1.5">${ic(icon, 'w-3.5 h-3.5')}${title}</div>${body}</div>` : '';

    <div class="flex flex-wrap items-center gap-2"><span class="font-semibold capitalize">${esc(s.role)}</span>${s.primary && t.svcs.length > 1 ? '<span class="tag s">principal</span>' : ''}
      ${s.health ? `<span class="tag g">${ic('heart', 'w-3 h-3')}healthcheck</span>` : ''}${s.backup ? `<span class="tag g">${ic('archive', 'w-3 h-3')}respaldo SQL</span>` : ''}
      <span class="mono text-xs text-slate-400 ml-auto break-all">${esc(s.image)}</span></div>
    <div class="grid sm:grid-cols-2 gap-4">
      ${sec('Puertos', 'plug', s.ports.length ? `<div class="space-y-1">${s.ports.map(p => { const x = parsePort(p); return `<div class="mono text-xs"><span class="text-sky-300">${esc(x.host || 'auto')}</span> <span class="text-slate-600">→</span> ${esc(x.cont)}<span class="text-slate-500">/${esc(x.proto)}</span></div>`; }).join('')}</div>` : '')}

// Traer desde Git: público, o privado con usuario y token (https). Compose se levanta; Dockerfile abre el formulario de instalación.
function gitModal() {
  let priv = false;
  const m = modal(`<div class="flex items-start gap-3 px-5 py-4 border-b border-slate-800"><div class="tile sq">${ic('git', 'w-5 h-5')}</div>
      <div class="min-w-0 flex-1"><div class="font-semibold text-lg">Traer desde Git</div>
        <div class="text-sm text-slate-400">Clona el repositorio en el servidor. Con <span class="mono">compose.yaml</span> lo levanta; con <span class="mono">Dockerfile</span> construye la imagen y te deja revisar puertos y variables.</div></div>
      ${ibtn('x', 'Cerrar', 'data-do="closeModal"')}</div>
    <form id="g-form" class="flex-1 overflow-auto px-5 py-4 space-y-4">
      <label class="block"><span class="text-sm text-slate-300">URL del repositorio</span>
        <input id="g-url" name="url" class="inp mono mt-1" placeholder="https://github.com/usuario/repositorio.git" required autocomplete="off" spellcheck="false"></label>
      <div class="grid sm:grid-cols-3 gap-3">
        <label class="block"><span class="text-xs text-slate-400">Rama o etiqueta</span><input name="ref" class="inp mono mt-1" placeholder="la principal"></label>
        <label class="block"><span class="text-xs text-slate-400">Nombre</span><input name="name" class="inp mono mt-1" placeholder="según el repositorio"></label>
        <label class="block"><span class="text-xs text-slate-400">Subcarpeta</span><input name="subdir" class="inp mono mt-1" placeholder="raíz"></label></div>
      <div class="space-y-3"><div class="seg" id="g-seg"><button type="button" data-p="0" class="on">${ic('globe', 'w-3.5 h-3.5')}Público</button><button type="button" data-p="1">${ic('lock', 'w-3.5 h-3.5')}Privado</button></div>
        <div id="g-auth" class="hidden space-y-3 rounded-lg border border-slate-800 bg-slate-900/50 p-4">
          <div class="grid sm:grid-cols-2 gap-3">
            <label class="block"><span class="text-xs text-slate-400">Usuario</span><input name="user" class="inp mono mt-1" autocomplete="off" placeholder="tu usuario de Git"></label>
            <label class="block"><span class="text-xs text-slate-400">Token de acceso</span>
              <div class="relative"><input name="token" type="password" class="inp mono mt-1 !pr-10" autocomplete="new-password" placeholder="ghp_… / glpat-…">
              <button type="button" class="absolute right-1 top-2 ibtn !w-7 !h-7" data-tip="Mostrar u ocultar" data-eye>${ic('eye')}</button></div></label></div>
          <p class="text-xs text-slate-500 leading-relaxed">Crea un token con permiso de lectura del repositorio (GitHub: <i>Fine-grained token → Contents: read</i>; GitLab: <i>read_repository</i>).
            Se usa solo por https y <b class="text-slate-400">queda guardado en el servidor</b> (<span class="mono">~/.local/share/dockyard/git-credentials</span>, modo 0600) para que «Actualizar» pueda hacer <span class="mono">git pull</span>. Con SSH (<span class="mono">git@…</span>) se usan las llaves del servidor y no hace falta token.</p></div></div>
      <p class="flex gap-2 text-xs text-amber-300/90 leading-relaxed">${ic('alert', 'w-4 h-4 mt-0.5')}<span>Despliega solo repositorios en los que confíes: su <span class="mono">Dockerfile</span> o <span class="mono">compose.yaml</span> se ejecuta con acceso a Docker de este servidor.</span></p>
    </form>
    <div class="flex justify-end gap-2 px-5 py-3 border-t border-slate-800"><button class="btn" data-do="closeModal">Cancelar</button>
      <button class="btn btn-primary" id="g-go">${ic('download')}Traer y desplegar</button></div>`, { wide: false });
  const form = $('#g-form', m);
  $('#g-seg', m).addEventListener('click', e => {
    const b = e.target.closest('[data-p]'); if (!b) return;
    priv = b.dataset.p === '1';
    $$('#g-seg button', m).forEach(x => x.classList.toggle('on', x === b));
    $('#g-auth', m).classList.toggle('hidden', !priv);
    if (priv) form.user.focus();
  });
  $('[data-eye]', m).addEventListener('click', () => form.token.type = form.token.type === 'password' ? 'text' : 'password');
  const go = () => {
    if (!form.reportValidity()) return;
    const v = n => form[n].value.trim();
    // una URL con «usuario:token@» también vale: el servidor la separa y no la guarda
    const body = { url: v('url'), ref: v('ref'), name: v('name'), subdir: v('subdir') };
    if (priv) { body.user = v('user'); body.token = form.token.value; }
    m.close();
    runJob(post('/api/git', body), `Traer desde Git`, r => {
      if (!r.plan) return `<div class="text-sm">✔ «${esc(r.name)}» levantado con Compose. Lo verás como stack en Contenedores.</div>`;
      const jm = topModal();
      setTimeout(() => { jm?.close(); install(null, r.plan); }, 700);
      return `<div class="text-sm">✔ Imagen construida. Abriendo el formulario para revisar puertos y variables…</div>`;
    });
  };
  $('#g-go', m).addEventListener('click', go);
  form.addEventListener('submit', e => { e.preventDefault(); go(); });
  $('#g-url', m).focus();
}

// `pre`: plan ya armado (p. ej. construido desde Git); sin él se parte de la plantilla `tid`.
async function install(tid, pre = null) {
  catalog ??= await api('/api/catalog');
  const t = pre ? { id: 'custom', name: pre.name, category: 'Git', description: pre.template_name, note: pre.note, services: pre.services.length } : catalog.find(x => x.id === tid);
  let ip = info.access[0]?.ip ?? '', plan = null, name = '';
  const m = modal(`<div class="flex items-start gap-3 px-5 py-4 border-b border-slate-800">${tile(t, 'sm')}<div class="min-w-0 flex-1"><div class="font-semibold text-lg truncate">${pre ? 'Desplegar' : 'Instalar'} ${esc(t.name)}</div><div class="text-sm text-slate-400 truncate">${esc(t.description)}</div></div>${ibtn('x', 'Cerrar', 'data-do="closeModal"')}</div>
    <div class="flex-1 overflow-auto px-5 py-4 space-y-5">
      ${t.note ? `<div class="rounded-lg bg-sky-950/50 border border-sky-900 px-4 py-3 text-sm text-sky-100 flex gap-2">${ic('info', 'w-4 h-4 mt-0.5')}<span>${esc(t.note)}</span></div>` : ''}
      <div class="grid sm:grid-cols-2 gap-4">
        <label class="block"><span class="text-sm text-slate-300">Nombre</span>
          <input id="i-name" class="inp mono mt-1" autocomplete="off"><span class="text-xs text-slate-500">Se usa para el contenedor${t.services > 1 ? ', los demás servicios' : ''} y sus volúmenes.</span></label>
        <div><span class="text-sm text-slate-300">¿Quién puede entrar?</span><div id="i-access" class="mt-1 space-y-1.5"></div></div>
      </div>
      <div id="i-form" data-mode="install" class="space-y-4">${loading('preparando…')}</div>
      <div id="i-err" class="text-sm text-red-300 whitespace-pre-line"></div>
    </div>
    <div class="flex items-center gap-2 px-5 py-3 border-t border-slate-800"><span id="i-warn" class="text-xs text-amber-300 flex-1"></span>
      <button class="btn" data-do="closeModal">Cancelar</button><button id="i-go" class="btn btn-primary" disabled>${ic('download')}${pre ? 'Desplegar' : 'Instalar'}</button></div>`, { wide: true });
  const form = $('#i-form', m);
  $('#i-access', m).innerHTML = info.access.map((a, k) => `<label class="flex items-start gap-2 text-sm cursor-pointer"><input type="radio" name="acc" value="${esc(a.ip)}" ${k === 0 ? 'checked' : ''} class="mt-1 accent-sky-500">
    <span><span class="text-slate-200">${esc(a.label)}</span><br><span class="text-xs text-slate-500">${esc(a.hint)}</span></span></label>`).join('');
  const rerender = () => { form.dataset.ip = ip; form.innerHTML = plan.services.map((_, i) => svcForm(plan, i, 'install')).join(''); check(); };
  const check = debounce(async () => {
    if (!plan) return;
    const r = await post('/api/check?new=1', tidy(structuredClone(plan))).catch(e => ({ errors: [e.message], warnings: [], busy: [] }));
    $('#i-err', m).textContent = r.errors.join('\n');
    $('#i-warn', m).textContent = r.warnings.join(' · ');
    $$('[data-busy]', m).forEach(el => el.classList.toggle('hidden', !r.busy.includes(el.dataset.busy)));
    $('#i-go', m).disabled = r.errors.length > 0;
  }, 350);
  const load = async () => {
    if (pre) { plan ??= structuredClone(pre); plan.name = name || plan.name; applyIp(); }
    else plan = (await api(`/api/plan?${qs({ t: tid, name, ip })}`)).plan;
    name = plan.name; $('#i-name', m).value = name;
    rerender();
  };
  bindPlanForm(form, () => plan, rerender, check);
  $('#i-name', m).addEventListener('input', debounce(e => { name = e.target.value.trim(); if (name) load(); }, 500));  // con `pre`, load() solo cambia el nombre del plan
  const applyIp = () => { for (const s of plan.services) s.ports = s.ports.map(p => { const x = parsePort(p); if (x.host) x.ip = ip; return joinPort(x); }); };
  $('#i-access', m).addEventListener('change', e => { ip = e.target.value; applyIp(); rerender(); });
  $('#i-go', m).addEventListener('click', () => {
    const p = tidy(structuredClone(plan));
    m.close();
    runJob(post('/api/deploy', p), `Instalando ${p.name}`, deployResult);
  });
  try { await load(); $('#i-name', m).select(); } catch (e) { form.innerHTML = `<div class="text-red-300">${esc(e.message)}</div>`; }
}

async function restore(file, target) {
  const vol = file.endsWith('.tar.gz');
  const names = vol ? (await api('/api/volumes').catch(() => [])).map(v => v.name) : (state?.containers || []).map(c => c.name);
  const m = modal(`${mHead('Restaurar respaldo', esc(file))}
    <div class="px-5 py-4 space-y-4 text-sm">
      <label class="block"><span class="text-slate-300">${vol ? 'Volumen destino' : 'Contenedor de base de datos destino'}</span>

      ${vol ? `<label class="flex items-start gap-2"><input id="r-clean" type="checkbox" class="mt-0.5 accent-red-500"> <span>Vaciar el volumen antes (deja solo lo del respaldo)</span></label>
        <p class="text-amber-300">Detén el contenedor que use este volumen antes de restaurar.</p>`
      : `<p class="text-amber-300">Se cargará en la base de datos y puede sobrescribir datos. El contenedor debe estar en ejecución.</p>`}
    </div>
    <div class="flex justify-end gap-2 px-5 py-3 border-t border-slate-800"><button class="btn" data-do="closeModal">Cancelar</button><button id="r-go" class="btn btn-danger">Restaurar</button></div>`);

    const t = $('#r-t', m).value.trim(); if (!t) return;
    const clean = $('#r-clean', m)?.checked ? 1 : 0;
    m.close();
    runJob(post('/api/restore?' + qs({ target: t, file, clean })), `Restaurando ${t}`, () => `<div class="text-sm">Restaurado en <span class="mono">${esc(t)}</span>.</div>`);
  });
}
async function restorePick(target) {
  const d = await api('/api/backups');
  const files = d.files.filter(f => f.target === target);
  if (!files.length) { toast(`No hay respaldos de ${target}`, false); return; }
  restore(files[0].file, target);
}

// ───────────── vista: espacio ─────────────
const PRUNE = {
  containers: ['Borrar contenedores detenidos', 'Se borran todos los contenedores detenidos. Sus volúmenes se conservan.'],
  images: ['Borrar imágenes sin uso', 'Se borran las imágenes que no usa ningún contenedor. Se vuelven a descargar si las necesitas.'],
  build: ['Borrar caché de construcción', 'Se borra la caché de docker build. La próxima construcción tardará más.'],
  networks: ['Borrar redes sin uso', 'Se borran las redes que no usa ningún contenedor.'],
  volumes: ['Borrar volúmenes huérfanos', '<b class="text-red-300">Se borran los datos</b> de los volúmenes que no usa ningún contenedor. No se puede deshacer.'],
};
const Space = {
  async mount() {
    $('#view').innerHTML = `<h1 class="text-2xl font-semibold mb-1">Espacio</h1><p class="text-sm text-slate-400 mb-5">Lo que ocupa Docker y lo que puedes liberar.</p><div id="sp-body">${loading('calculando… (puede tardar con volúmenes grandes)')}</div>`;
    await this.reload();
    this.timer = setInterval(() => this.reload(), 10000);
  },
  unmount() { clearInterval(this.timer); },
  async reload() {
    const d = await api('/api/space').catch(e => ({ error: e.message }));
    if (!$('#sp-body')) return;
    if (d.error) { $('#sp-body').innerHTML = `<div class="text-red-300">${esc(d.error)}</div>`; return; }
    if (d.loading) return;
    $('#sp-body').innerHTML = `<div class="space-y-6">
      ${d.root ? `<div class="card px-4 py-3 max-w-xl"><div class="text-sm">Disco de Docker <span class="mono text-slate-400">${esc(d.root.path)}</span></div>
        <div class="text-xl font-semibold mt-1">${esc(d.root.used)} <span class="text-sm text-slate-400 font-normal">de ${esc(d.root.total)}</span></div>${bar(d.root.pct, 80, 92)}</div>` : ''}
      <div class="grid sm:grid-cols-2 xl:grid-cols-4 gap-3">${d.rows.map(r => `<div class="card px-4 py-3 flex flex-col">
        <div class="text-xs uppercase tracking-wide text-slate-500">${esc(r.name)}</div>
        <div class="text-xl font-semibold mt-0.5">${r.known ? esc(r.size) : '—'}</div>
        <div class="text-xs text-slate-400">${r.count} en total · ${r.active} en uso</div>
        <div class="text-sm mt-2 ${r.reclaimable_bytes > 0 ? 'text-amber-300' : 'text-slate-500'}">${r.known ? `${esc(r.reclaimable)} recuperables` : ''}</div>
        <button class="btn btn-sm mt-3 justify-center ${r.id === 'volumes' ? 'btn-danger' : ''}" data-do="prune" data-what="${r.id}" ${r.reclaimable_bytes > 0 ? '' : 'disabled'}>${ic('sparkles')}Liberar</button></div>`).join('')}</div>
      <div class="flex"><button class="btn btn-sm" data-do="prune" data-what="networks">${ic('trash')}Borrar redes sin uso</button></div>
      ${d.volumes.length ? `<div><h2 class="font-semibold mb-2">Volúmenes más grandes</h2><div class="card divide-y divide-slate-800 max-w-3xl">${d.volumes.map(v => `<div class="flex justify-between gap-4 px-4 py-2"><span class="mono text-sm truncate">${esc(v.name)}</span><span class="mono text-sm shrink-0">${esc(v.size)}</span></div>`).join('')}</div></div>` : ''}
    </div>`;
  },
};

// ───────────── acciones (delegadas) ─────────────
const ACTIONS = {
  closeModal: (d, el) => el.closest('.fixed')?.close(),
  copy: d => copy(d.text),
  act: d => act(d.id, d.a),
  removeC: async d => { await act(d.id, 'remove'); if (!findC(d.id)) topModal()?.close(); },
  update: d => { const c = findC(d.id); runJob(post('/api/update?' + qs({ id: d.id, name: c?.name || '' })), `Actualizando ${c?.name || ''}`, r => `<div class="text-sm">${r.updated ? '✔ Se actualizó a la versión más reciente.' : 'Ya tenía la versión más reciente; no se tocó.'}</div>`); },
  downStack: d => downStack(d.stack),
  openContainer: d => openContainer(d.id, d.tab),
  install: d => install(d.t),
  storeDetail: d => storeDetail(d.t),
  gitModal: () => gitModal(),
  tunnelStop: async d => {
    if (!await ask('Cerrar el túnel', 'El enlace público deja de funcionar al instante.', { okText: 'Cerrar túnel', danger: true })) return;
    try { await post('/api/tunnel/stop?' + qs({ name: d.name })); toast('Túnel cerrado'); } catch (e) { toast(e.message, false); }
    reloadTunnels && reloadTunnels(); refreshState();
  },
  // descarga con ticket de un solo uso: el enlace no lleva el token
  dl: async d => {
    try {
      const { ticket } = await post('/api/ticket?' + qs({ file: d.file }));
      const a = document.createElement('a'); a.href = '/api/download?' + qs({ ticket }); a.download = d.file;
      document.body.append(a); a.click(); a.remove();
    } catch (e) { toast(e.message, false); }
  },
  backup: d => backup(d.target),
  restore: d => restore(d.file, d.target),
  restorePick: d => restorePick(d.target),
  pullAgain: d => runJob(post('/api/pull?' + qs({ image: d.image })), `Descargando ${d.image}`, () => '<div class="text-sm">Descargada. Usa «Actualizar» en el contenedor para recrearlo con ella.</div>'),
  rmi: async d => { if (!await ask(`Borrar ${d.name}`, 'Se borra la imagen del disco.', { okText: 'Borrar', danger: true })) return; try { await post('/api/rmi?' + qs({ id: d.id })); toast('Imagen borrada'); } catch (e) { toast(e.message, false); } view.reload(); },
  rmvol: async d => { if (!await ask(`Borrar ${d.name}`, '<b class="text-red-300">Se borran sus datos para siempre.</b> Si no estás seguro, respáldalo antes.', { okText: 'Borrar', danger: true })) return; try { await post('/api/rmvol?' + qs({ name: d.name })); toast('Volumen borrado'); } catch (e) { toast(e.message, false); } view.reload(); },
  rmbackup: async d => { if (!await ask('Borrar respaldo', esc(d.file), { okText: 'Borrar', danger: true })) return; try { await post('/api/rmbackup?' + qs({ file: d.file })); toast('Respaldo borrado'); } catch (e) { toast(e.message, false); } view.reload(); },
  prune: async d => {
    const [t, msg] = PRUNE[d.what];
    if (!await ask(t, msg, { okText: 'Liberar', danger: d.what === 'volumes' })) return;
    try { toast((await post('/api/prune?' + qs({ what: d.what }))).message); } catch (e) { toast(e.message, false); }
    setTimeout(() => view.reload && view.reload(), 1500);
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-do]');
  if (!el || !ACTIONS[el.dataset.do]) return;
  if (el.classList.contains('off')) { e.preventDefault(); return; }
  // los formularios de plan manejan sus propios botones
  if (el.closest('[data-mode]') && ['addRow', 'delRow', 'reveal', 'copyPrev'].includes(el.dataset.do)) return;
  e.preventDefault();
  ACTIONS[el.dataset.do](el.dataset, el);
});

// ───────────── enrutador ─────────────
const ROUTES = { panel: Panel, contenedores: Containers, tienda: Store, imagenes: Images, volumenes: Volumes, respaldos: Backups, espacio: Space };
function route() {
  view.unmount && view.unmount();
  const id = location.hash.slice(2) || 'panel';
  view = ROUTES[id] || Panel;
  renderNav();
  window.scrollTo(0, 0);
  view.mount();
}
window.addEventListener('hashchange', route);

(async () => {
  if (!token) { showLogin(); return; }
  info = await api('/api/info').catch(() => info);
  route();
  await refreshState();
  setInterval(refreshState, 3000);
})();
</script>
</body>
</html>
