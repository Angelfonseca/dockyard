[package]
name = "dockyard"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bollard = { version = "0.21.1", features = ["ssh"] }
bytes = "1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
futures-util = "0.3.34"
libc = "0.2"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.39.6"
tar = { version = "0.4", default-features = false }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "process", "fs", "io-util", "net"] }
toml = "1.1.8"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
