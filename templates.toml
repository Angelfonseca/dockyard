dump = 'pg_dump --clean --if-exists -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
dump_ext = "sql"
restore = 'psql -q -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"'

