# ═══════════════════════════ Aplicaciones ═══════════════════════════

[[template]]
id = "nextcloud"
name = "Nextcloud + MariaDB + Redis + cron"
category = "Aplicaciones"
description = "Nube personal completa: app, base de datos, caché y tareas programadas."
note = "Tras desplegar, abre el puerto elegido y crea el usuario administrador."
[[template.service]]
role = "app"
primary = true
image = "nextcloud:apache"
ports = ["8080:80"]
env = ["MYSQL_HOST={{host:db}}", "MYSQL_DATABASE=nextcloud", "MYSQL_USER=nextcloud", "MYSQL_PASSWORD={{secret:db}}", "REDIS_HOST={{host:redis}}", "NEXTCLOUD_ADMIN_USER=admin", "NEXTCLOUD_ADMIN_PASSWORD={{secret:admin}}"]
volumes = ["{{name}}-html:/var/www/html"]
[[template.service]]
role = "db"
image = "mariadb:11.4"
cmd = ["--transaction-isolation=READ-COMMITTED", "--binlog-format=ROW"]
env = ["MARIADB_ROOT_PASSWORD={{secret:root}}", "MARIADB_DATABASE=nextcloud", "MARIADB_USER=nextcloud", "MARIADB_PASSWORD={{secret:db}}", "MARIADB_AUTO_UPGRADE=1"]
volumes = ["{{name}}-db:/var/lib/mysql"]
healthcheck = 'mariadb-admin ping -h 127.0.0.1 --silent'
dump = 'mariadb-dump -uroot -p"$MARIADB_ROOT_PASSWORD" --all-databases --single-transaction'
dump_ext = "sql"
restore = 'mariadb -uroot -p"$MARIADB_ROOT_PASSWORD"'
[[template.service]]
role = "redis"
image = "redis:7-alpine"
healthcheck = "redis-cli ping | grep -q PONG"
[[template.service]]
role = "cron"
image = "nextcloud:apache"
cmd = ["/cron.sh"]
env = ["MYSQL_HOST={{host:db}}", "MYSQL_DATABASE=nextcloud", "MYSQL_USER=nextcloud", "MYSQL_PASSWORD={{secret:db}}", "REDIS_HOST={{host:redis}}"]
volumes = ["{{name}}-html:/var/www/html"]

[[template]]
id = "wordpress"
