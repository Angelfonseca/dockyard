[[template]]
id = "keycloak"
name = "Keycloak + PostgreSQL"
category = "Aplicaciones"
description = "Inicio de sesión único (SSO), OAuth2 y OpenID Connect. Modo desarrollo (HTTP)."
note = "Para producción pon un proxy con HTTPS y cambia el comando a «start» con KC_HOSTNAME."
