# Catálogo integrado de dockyard.
#
# Puedes añadir o reemplazar plantillas en ~/.config/dockyard/templates.toml
# (misma estructura; si el `id` coincide, tu versión reemplaza a la integrada).
#
# Marcadores que se resuelven al crear el despliegue:
#   {{name}}         nombre del stack que elijas
#   {{secret:CLAVE}} contraseña aleatoria; la misma CLAVE da el mismo valor en todo el stack
#   {{rand}}         cadena aleatoria nueva
#   {{host:rol}}     nombre del contenedor del servicio con ese `role` (DNS interno del stack)
#
# Campos de [[template.service]]:
#   role, image, ports ["host:contenedor[/udp]"], env ["K=V"], volumes ["vol:/ruta" | "/host:/ruta:ro"],
#   restart, mem ("512m"), cmd ["arg", ...], primary, tty, stdin_open,
#   cpus ("1.5" núcleos), healthcheck (comando sh: 0 = listo; en stacks se espera por él antes de arrancar el principal),
#   dump (comando para respaldar, se ejecuta con sh -c dentro del contenedor), dump_ext (extensión del archivo),
#   restore (comando sh que lee el respaldo por stdin)

# ═══════════════════════════ Bases de datos ═══════════════════════════

[[template]]
id = "postgres"
name = "PostgreSQL 17"
category = "Bases de datos"
description = "Base de datos relacional. Imagen alpine, ligera."
[[template.service]]
role = "db"
image = "postgres:17-alpine"
ports = ["5432:5432"]
env = ["POSTGRES_USER=app", "POSTGRES_PASSWORD={{secret:pass}}", "POSTGRES_DB=app"]
volumes = ["{{name}}-data:/var/lib/postgresql/data"]
healthcheck = 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
dump = 'pg_dump --clean --if-exists -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
dump_ext = "sql"
restore = 'psql -q -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"'

[[template]]
id = "mariadb"
name = "MariaDB 11.4 (LTS)"
category = "Bases de datos"
description = "Compatible con MySQL. Versión de soporte largo."
[[template.service]]
role = "db"
image = "mariadb:11.4"
ports = ["3306:3306"]
env = ["MARIADB_ROOT_PASSWORD={{secret:root}}", "MARIADB_DATABASE=app", "MARIADB_USER=app", "MARIADB_PASSWORD={{secret:pass}}", "MARIADB_AUTO_UPGRADE=1"]
volumes = ["{{name}}-data:/var/lib/mysql"]
healthcheck = 'mariadb-admin ping -h 127.0.0.1 --silent'
dump = 'mariadb-dump -uroot -p"$MARIADB_ROOT_PASSWORD" --all-databases --single-transaction'
dump_ext = "sql"
restore = 'mariadb -uroot -p"$MARIADB_ROOT_PASSWORD"'

[[template]]
id = "mysql"
name = "MySQL 8.4 (LTS)"
category = "Bases de datos"
description = "MySQL oficial, versión de soporte largo."
[[template.service]]
role = "db"
image = "mysql:8.4"
ports = ["3306:3306"]
env = ["MYSQL_ROOT_PASSWORD={{secret:root}}", "MYSQL_DATABASE=app", "MYSQL_USER=app", "MYSQL_PASSWORD={{secret:pass}}"]
volumes = ["{{name}}-data:/var/lib/mysql"]
healthcheck = 'mysqladmin ping -h 127.0.0.1 --silent'
dump = 'mysqldump -uroot -p"$MYSQL_ROOT_PASSWORD" --all-databases --single-transaction'
dump_ext = "sql"
restore = 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD"'

[[template]]
id = "mongo"
name = "MongoDB 8"
category = "Bases de datos"
description = "Base de datos de documentos. Requiere CPU con AVX."
[[template.service]]
role = "db"
image = "mongo:8"
ports = ["27017:27017"]
env = ["MONGO_INITDB_ROOT_USERNAME=admin", "MONGO_INITDB_ROOT_PASSWORD={{secret:pass}}"]
volumes = ["{{name}}-data:/data/db"]
healthcheck = 'mongosh --quiet --eval "db.adminCommand({ping: 1}).ok" | grep -q 1'
dump = 'mongodump --archive --gzip -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin'
dump_ext = "archive.gz"
restore = 'mongorestore --archive --gzip --drop -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin'

[[template]]
id = "redis"
name = "Redis 7"
category = "Bases de datos"
description = "Almacén clave-valor en memoria, con contraseña y persistencia AOF."
[[template.service]]
role = "cache"
image = "redis:7-alpine"
ports = ["6379:6379"]
cmd = ["redis-server", "--requirepass", "{{secret:pass}}", "--appendonly", "yes"]
healthcheck = "redis-cli ping | grep -qE 'PONG|NOAUTH'"
volumes = ["{{name}}-data:/data"]

[[template]]
id = "valkey"
name = "Valkey 8"
category = "Bases de datos"
description = "Fork libre de Redis, compatible con su protocolo."
[[template.service]]
role = "cache"
image = "valkey/valkey:8-alpine"
ports = ["6379:6379"]
cmd = ["valkey-server", "--requirepass", "{{secret:pass}}", "--appendonly", "yes"]
healthcheck = "valkey-cli ping | grep -qE 'PONG|NOAUTH'"
volumes = ["{{name}}-data:/data"]

[[template]]
id = "memcached"
name = "Memcached"
category = "Bases de datos"
description = "Caché en memoria muy simple."
[[template.service]]
role = "cache"
image = "memcached:alpine"
ports = ["11211:11211"]
cmd = ["memcached", "-m", "128"]

[[template]]
id = "pgvector"
name = "PostgreSQL 17 + pgvector"
category = "Bases de datos"
description = "PostgreSQL con la extensión pgvector para búsquedas por similitud (IA, embeddings)."
note = "Activa la extensión en tu base: CREATE EXTENSION vector;"
[[template.service]]
role = "db"
image = "pgvector/pgvector:pg17"
ports = ["5432:5432"]
env = ["POSTGRES_USER=app", "POSTGRES_PASSWORD={{secret:pass}}", "POSTGRES_DB=app"]
volumes = ["{{name}}-data:/var/lib/postgresql/data"]
healthcheck = 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
dump = 'pg_dump --clean --if-exists -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
dump_ext = "sql"
restore = 'psql -q -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"'

[[template]]
id = "clickhouse"
name = "ClickHouse"
category = "Bases de datos"
description = "Base de datos columnar para analítica. HTTP en :8123, protocolo nativo en :19000."
[[template.service]]
role = "db"
image = "clickhouse/clickhouse-server:latest"
ports = ["8123:8123", "19000:9000"]
env = ["CLICKHOUSE_DB=app", "CLICKHOUSE_USER=app", "CLICKHOUSE_PASSWORD={{secret:pass}}", "CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1"]
volumes = ["{{name}}-data:/var/lib/clickhouse", "{{name}}-logs:/var/log/clickhouse-server"]
healthcheck = "wget -q -O- http://127.0.0.1:8123/ping"

[[template]]
id = "meilisearch"
name = "Meilisearch"
category = "Bases de datos"
description = "Motor de búsqueda instantánea, tolerante a errores de escritura. API en :7700."
[[template.service]]
image = "getmeili/meilisearch:latest"
ports = ["7700:7700"]
env = ["MEILI_MASTER_KEY={{secret:key}}", "MEILI_ENV=production", "MEILI_NO_ANALYTICS=true"]
volumes = ["{{name}}-data:/meili_data"]
healthcheck = "curl -fs http://127.0.0.1:7700/health"

[[template]]
id = "qdrant"
name = "Qdrant"
category = "Bases de datos"
description = "Base de datos vectorial para IA (RAG, búsqueda semántica). REST :6333, gRPC :6334."
[[template.service]]
image = "qdrant/qdrant:latest"
ports = ["6333:6333", "6334:6334"]
env = ["QDRANT__SERVICE__API_KEY={{secret:key}}"]
volumes = ["{{name}}-data:/qdrant/storage"]

[[template]]
id = "nats"
name = "NATS + JetStream"
category = "Bases de datos"
description = "Mensajería ligera con persistencia (JetStream). Clientes en :4222, monitoreo en :8222."
[[template.service]]
image = "nats:2-alpine"
ports = ["4222:4222", "8222:8222"]
cmd = ["--jetstream", "--store_dir", "/data", "-m", "8222", "--user", "app", "--pass", "{{secret:pass}}"]
volumes = ["{{name}}-data:/data"]
healthcheck = "wget -q -O- http://127.0.0.1:8222/healthz"

[[template]]
id = "influxdb"
name = "InfluxDB 2"
category = "Bases de datos"
description = "Series de tiempo (métricas, sensores). Crea usuario, organización y bucket iniciales."
[[template.service]]
role = "db"
image = "influxdb:2"
ports = ["8086:8086"]
env = ["DOCKER_INFLUXDB_INIT_MODE=setup", "DOCKER_INFLUXDB_INIT_USERNAME=admin", "DOCKER_INFLUXDB_INIT_PASSWORD={{secret:pass}}", "DOCKER_INFLUXDB_INIT_ORG=casa", "DOCKER_INFLUXDB_INIT_BUCKET=datos", "DOCKER_INFLUXDB_INIT_ADMIN_TOKEN={{secret:token}}"]
volumes = ["{{name}}-data:/var/lib/influxdb2", "{{name}}-config:/etc/influxdb2"]
healthcheck = "influx ping"

