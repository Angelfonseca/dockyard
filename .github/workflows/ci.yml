name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # La versión de Rust y clippy están fijadas en rust-toolchain.toml; rustup la instala sola.
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Pruebas unitarias (sin Docker)
        run: cargo test --bins
      - name: Pruebas de integración (Docker del runner)
        run: DOCKYARD_IT=1 cargo test --test integracion -- --test-threads=1
      - name: Prueba de humo del panel web
        run: cargo build && sh scripts/smoke-web.sh target/debug/dockyard
      - name: Binario release
        run: cargo build --release && ls -lh target/release/dockyard

  # Lo que declara `rust-version` en Cargo.toml debe compilar de verdad.
  msrv:
    runs-on: ubuntu-latest
    container: rust:1.95
    env:
      RUSTUP_TOOLCHAIN: "1.95.0"
    steps:
      - uses: actions/checkout@v4
      - name: Compilar con la versión mínima
        run: cargo check --bins

  # Vulnerabilidades (RustSec), licencias, fuentes y duplicados (deny.toml).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Instalar cargo-audit y cargo-deny
        run: cargo install cargo-audit cargo-deny --locked
      - name: Auditar Cargo.lock
        run: cargo audit
      - name: Política de dependencias
        run: cargo deny check

  # Pruebas de integración contra daemons de Docker antiguos (API antes y después de la 1.52).
  api-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        docker: ["25", "27", "29"]
    steps:
      - uses: actions/checkout@v4
      - name: Integración contra Docker ${{ matrix.docker }}
        run: sh scripts/test-api-matrix.sh ${{ matrix.docker }}

  # El binario estático corre en cada distribución (sin daemon: ayuda, horario y verificación de respaldos).
  distros:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:stable", "ubuntu:24.04", "fedora:latest", "alpine:3", "opensuse/tumbleweed"]
    steps:
      - uses: actions/checkout@v4
      - name: Compilar el binario estático
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --target x86_64-unknown-linux-musl
      - name: Probar en ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD":/src:ro -v "$PWD/target/x86_64-unknown-linux-musl/release":/bin-dir:ro \
            "${{ matrix.image }}" sh -c '
              set -e
              /bin-dir/dockyard --help >/dev/null
              /bin-dir/dockyard schedule --format cron --at 04:15 | grep -q "backup --all"
              tar czf /tmp/prueba.tar.gz -C /src README.md
              /bin-dir/dockyard verify /tmp/prueba.tar.gz | grep -q correcto
              echo "ok en $(cat /etc/os-release | sed -n "s/^PRETTY_NAME=//p" | tr -d \")"
            '
